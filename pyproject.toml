[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "queueforge"
version = "0.1.0"
description = "为本机后台计算提供可恢复任务状态：幂等提交、并发领取、租约过期重领、token栅栏、失败退避、死信重试与事件记录"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
[project.scripts]
queueforge = "queueforge.__main__:main"
[tool.setuptools.packages.find]
include = ["queueforge*"]
[tool.setuptools.package-data]
queueforge = ["web/*.html", "web/*.js", "web/*.css"]
